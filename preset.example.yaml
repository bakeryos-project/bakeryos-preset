name: Example preset
id: bakeryos.presets.Example
stages:
  - name: Apply Stage
    triggers: ["apply"]
    packages:
      - name: fastfetch
    backups:
      - "/etc/issue"
    configs:
      - env:
        - name: HELLO
          value: HELLO


  - name: Restore Stage
    triggers: ["unapply"]
    restores:
      - "/etc/issue"